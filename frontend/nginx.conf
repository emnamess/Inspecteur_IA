server {
    listen 80;
    root /usr/share/nginx/html;

    # Les appels /api sont transmis au conteneur du back-end (même origine : pas de CORS).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 180s;  # une réponse vérifiée peut demander plusieurs appels au LLM
    }

    location / {
        try_files $uri /index.html;
    }
}
